name: Airport Gap — API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Newman
        run: npm install -g newman@6 newman-reporter-htmlextra@1

      - name: Verificar que el secreto existe
        run: test -n "$TOKEN" || (echo "❌ Falta el secreto AIRPORT_GAP_TOKEN" && exit 1)
        env:
          TOKEN: ${{ secrets.AIRPORT_GAP_TOKEN }}

      - name: Ejecutar tests
        run: |
          newman run airport-gap-tests.json \
            -e "Airport Gap QA.postman_environment.json" \
            --env-var "token=${{ secrets.AIRPORT_GAP_TOKEN }}" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reporte.html

      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-api-tests
          path: reporte.html
